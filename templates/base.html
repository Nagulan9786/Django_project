<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Access Request Tracker</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; }
    nav { display: flex; gap: 15px; align-items: center; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    .PENDING { color: orange; } .APPROVED { color: green; } .REJECTED { color: red; }
  </style>
</head>
<body>
  <nav>
    <h2>Access Tracker</h2>
    {% if user.is_authenticated %}
      <a href="{% url 'request_list' %}">My Requests</a>
      <a href="{% url 'request_create' %}">New Request</a>
      <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit">Logout ({{ user.username }})</button>
      </form>
    {% endif %}
  </nav>
  {% block content %}{% endblock %}
</body>
</html>
