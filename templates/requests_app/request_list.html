{% extends "base.html" %}
{% block content %}
  <h3>My Access Requests</h3>
  <table>
    <tr><th>Resource</th><th>Status</th><th>Raised on</th></tr>
    {% for r in requests %}
      <tr>
        <td>{{ r.resource }}</td>
        <td class="{{ r.status }}">{{ r.get_status_display }}</td>
        <td>{{ r.created_at|date:"d M Y, H:i" }}</td>
      </tr>
    {% empty %}
      <tr><td colspan="3">No requests yet.</td></tr>
    {% endfor %}
  </table>
{% endblock %}
